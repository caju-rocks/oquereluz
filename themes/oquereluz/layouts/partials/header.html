{{- $color := "areia" -}}
<nav class="navbar is-transparent" role="navigation" aria-label="main navigation">
  <div class="navbar-brand is-hidden-mobile">
    <a class="" href="{{ .Site.BaseURL }}">
      {{ partial (printf "logos/desktop-%s.html" $color) . }}
    </a>

    <a role="button" class="navbar-burger-secondary" aria-label="menu" aria-expanded="false" data-target="navbar-principal">

      <span aria-hidden="true"></span>

      <span aria-hidden="true"></span>
    </a>

    </a>

    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar-principal">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>

    <div class="navbar-end is-hidden-tablet has-text-centered">
      <a href="{{ .Site.BaseURL }}" class="navbar-item is-size-6 has-text-vermelho has-text-weight-semibold">

        CONTATO
      </a>
      <a href="https://instagram.com/{{ .Site.Params.social.instagram }}" target="_blank" class="instagram-vermelho is-large mt-4" style="border:none;">
        <span class="icon">
          <i class="fa-brands fa-instagram"></i>
        </span>
      </a>
    </div>
  </div>
