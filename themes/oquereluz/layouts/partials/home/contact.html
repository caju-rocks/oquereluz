<section id="contato" class="hero is-oquereluz-marrom">
  <div class="hero-body">
    <div class="container">
      <div class="columns">
        <div class="column is-one-quarter is-flex is-align-items-center">
          <h1 class="title is-size-1">contato</h1>
        </div>
        <div class="column is-half">
          <form id="contact-form" name="contact" method="POST" data-netlify="true">
            <!-- Nome e Email na mesma linha -->
            <div class="field is-horizontal">
              <div class="field-body">
                <div class="field">
                  <label class="label contato">nome</label>
                  <div class="control">
                    <input class="input is-medium is-oquereluz-transparent contato" name="nome" type="text" required>
                  </div>
                </div>
                <div class="field">
                  <label class="label contato">email</label>
                  <div class="control">
                    <input class="input is-medium is-oquereluz-transparent contato" name="email" type="email" required>
                  </div>
                </div>
              </div>
            </div>
            <div class="field">
              <label class="label contato">mensagem</label>
              <div class="control">
                <textarea class="textarea is-medium is-oquereluz-transparent contato" name="mensagem" required></textarea>
              </div>
            </div>
            <div class="field">
              <div class="control has-text-centered">
                <button class="button is-rounded px-6 is-medium is-oquereluz-areia">
                  <span class="icon">
                    <i class="fas fa-envelope"></i>
                  </span>
                  <span>enviar mensagem</span>
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="column">
          <div class="ml-6 contato-info">
            <div class="is-flex is-flex-direction-column">
              <div class="is-flex is-flex-direction-column">
                <span class="has-text-weight-bold">email</span>
                <span class="is-size-6">{{ .Site.Params.contact.email }}</span>
              </div>
              <div class="is-flex is-flex-direction-column">
                <span class="has-text-weight-bold">endereço</span>
                <span class="is-size-6">{{ .Site.Params.contact.address }}</span>
              </div>
            </div>
          </div>
        </div> <!-- contact info column -->
      </div> <!-- contact columns -->
    </div>
  </div>
</section>
