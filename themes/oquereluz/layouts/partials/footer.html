{{- if eq .Kind "home" -}}
<section class="hero is-oquereluz-vermelho">
{{- else -}}
<section class="hero is-oquereluz-vermelho">
{{- end -}}
  <div class="hero-body" style="margin-bottom:6rem;">
    <div class="container">
      <div class="columns is-variable is-1 is-multiline is-mobile has-text-centered-mobile is-flex-direction-column-mobile">
        <div class="column is-full-mobile is-oquereluz-one-third-tablet">
          {{ partial "logos/vertical-areia.html" }}
        </div>
        <div class="column is-full-mobile is-three-quarters-tablet">

          </ul>

        <div class="column is-full-mobile has-text-centered">
            <a href="https://instagram.com/{{ .Site.Params.social.instagram }}" target="_blank" class="instagram is-large" style="border:none;">
            <span class="icon">
